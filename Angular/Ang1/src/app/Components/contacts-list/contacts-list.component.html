<div class="row">
  <div class="col-6">
    <div class="card m-4">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span class="card-title mb-0">Lista kontaktów</span>
        <span>
          <button class="btn btn-primary" (click)="showForm()">Dodaj</button>
          <button class="btn btn-light" (click)="onClick()">
            {{ title }}
          </button>
        </span>
      </div>
      <div class="card-body">
        <app-search></app-search>
        <div *ngIf="isListShown">
          <ul class="list-group" *ngIf="(contacts$ | async)?.length; else emptyList">
            <li
              class="list-group-item"
              [class.active]="contact == selectedContact"
              (click)="changeContact(contact)"
              *ngFor="let contact of contacts$ | async; let idx = index"
            >
              <img
                class="icon"
                [src]="contact!.sex == Sex.Male ?
’/assets/images/man.png’ :
’/assets/images/woman.png’"
              />
              {{ idx + 1 }}. {{ contact.firstName }} {{ contact.lastName }} (<a
                [routerLinkActive]="’text-light’"
                href="mailto:{{ contact.email.value }}"
              >
                {{ contact.email.value }} </a
              >)
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="col-6">
    <app-contact *ngIf="selectedContact" [contact]="selectedContact" (closed)="contactClosed()">
    </app-contact>
    <router-outlet></router-outlet>
  </div>
</div>
